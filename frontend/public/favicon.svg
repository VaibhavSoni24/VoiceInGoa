<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <title>VoiceInGoa favicon</title>
  <desc>Flat vector microphone logo with sound waves and Goan tropical motif.</desc>

  <!-- Transparent background -->

  <!-- Forest-green circular badge -->
  <circle cx="256" cy="256" r="224" fill="#0B5E3C"/>

  <!-- Listening / echo arcs -->
  <path d="M132 128C96 164 78 208 78 256C78 304 96 348 132 384"
        stroke="#FDF6E3" stroke-width="18" stroke-linecap="round"/>
  <path d="M380 128C416 164 434 208 434 256C434 304 416 348 380 384"
        stroke="#FDF6E3" stroke-width="18" stroke-linecap="round"/>

  <!-- Small upper segmented echo accents -->
  <path d="M154 108L181 96" stroke="#FDF6E3" stroke-width="18" stroke-linecap="round"/>
  <path d="M331 96L358 108" stroke="#FDF6E3" stroke-width="18" stroke-linecap="round"/>

  <!-- Magenta accent -->
  <circle cx="374" cy="112" r="20" fill="#E6007E"/>

  <!-- Side waveform bars -->
  <rect x="112" y="222" width="18" height="68" rx="9" fill="#FDF6E3"/>
  <rect x="143" y="190" width="18" height="132" rx="9" fill="#FDF6E3"/>
  <rect x="174" y="212" width="18" height="88" rx="9" fill="#FDF6E3"/>
  <rect x="320" y="212" width="18" height="88" rx="9" fill="#FDF6E3"/>
  <rect x="351" y="190" width="18" height="132" rx="9" fill="#FDF6E3"/>
  <rect x="382" y="222" width="18" height="68" rx="9" fill="#FDF6E3"/>

  <!-- Microphone body -->
  <rect x="202" y="118" width="108" height="248" rx="54" fill="#FDF6E3"/>
  <rect x="220" y="136" width="72" height="202" rx="36" fill="#0B5E3C"/>

  <!-- Microphone grille -->
  <rect x="232" y="164" width="28" height="10" rx="5" fill="#FDF6E3"/>
  <rect x="252" y="164" width="28" height="10" rx="5" fill="#FDF6E3"/>
  <rect x="232" y="184" width="28" height="10" rx="5" fill="#FDF6E3"/>
  <rect x="252" y="184" width="28" height="10" rx="5" fill="#FDF6E3"/>
  <rect x="232" y="204" width="28" height="10" rx="5" fill="#FDF6E3"/>
  <rect x="252" y="204" width="28" height="10" rx="5" fill="#FDF6E3"/>

  <!-- Goan tropical motif -->
  <path d="M256 270C246 250 246 232 256 216" stroke="#FDF6E3" stroke-width="8" stroke-linecap="round"/>
  <path d="M256 236C239 224 226 222 214 228C229 233 240 241 249 251"
        fill="#FDF6E3"/>
  <path d="M257 232C270 216 282 211 296 214C286 224 276 235 265 245"
        fill="#FDF6E3"/>
  <path d="M256 238C246 220 236 210 223 208C229 221 238 233 251 246"
        fill="#FDF6E3"/>
  <path d="M259 238C269 222 282 215 294 216C287 229 276 240 264 249"
        fill="#FDF6E3"/>

  <!-- Shore and waves -->
  <path d="M222 276C236 268 249 268 262 276C276 284 289 284 300 276"
        stroke="#FDF6E3" stroke-width="8" stroke-linecap="round"/>
  <path d="M220 292C235 284 248 284 262 292C276 300 289 300 302 292"
        stroke="#FDF6E3" stroke-width="8" stroke-linecap="round"/>

  <!-- Tropical sun -->
  <circle cx="286" cy="256" r="10" fill="#FDF6E3"/>

  <!-- Microphone stand -->
  <path d="M202 320C202 357 226 378 256 378C286 378 310 357 310 320"
        stroke="#FDF6E3" stroke-width="18" stroke-linecap="round"/>
  <path d="M256 378V414" stroke="#FDF6E3" stroke-width="18" stroke-linecap="round"/>
  <path d="M218 424H294" stroke="#FDF6E3" stroke-width="18" stroke-linecap="round"/>
</svg>
